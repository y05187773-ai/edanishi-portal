<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荏田西ポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #060e09;
      --card-bg:    rgba(8,18,12,.76);
      --text-hi:    #edf7f0;
      --text-md:    #7a9486;
      --text-lo:    #2d4a38;
      --r:          14px;
      --active-glow:74,222,128;
      --border-angle:0deg;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { font-family:'Noto Sans JP','Inter',sans-serif; background:var(--bg); color:var(--text-hi); -webkit-font-smoothing:antialiased; overflow-x:hidden; }

    /* ── BG ── */
    #bg-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
    .ambient   { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .blob { position:absolute; border-radius:50%; filter:blur(120px); will-change:transform; }
    .blob-1 { width:700px;height:500px;background:radial-gradient(ellipse,rgba(16,185,129,.15) 0%,transparent 70%);top:-160px;left:-120px;animation:d1 26s ease-in-out infinite alternate; }
    .blob-2 { width:580px;height:580px;background:radial-gradient(ellipse,rgba(5,150,105,.11) 0%,transparent 70%);top:35%;right:-180px;animation:d2 32s ease-in-out infinite alternate; }
    .blob-3 { width:480px;height:380px;background:radial-gradient(ellipse,rgba(52,211,153,.08) 0%,transparent 70%);bottom:-80px;left:32%;animation:d3 22s ease-in-out infinite alternate; }
    @keyframes d1{to{transform:translate(50px,35px) scale(1.12)}}
    @keyframes d2{to{transform:translate(-35px,55px) scale(.9)}}
    @keyframes d3{to{transform:translate(-45px,-25px) scale(1.1)}}
    .dot-grid { position:fixed;inset:0;z-index:2;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px; }

    /* ── APP ── */
    #app { position:relative; z-index:3; display:flex; flex-direction:column; min-height:100vh; }

    /* ── TOP BAR ── */
    .top-bar {
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 24px;
      border-bottom:1px solid rgba(255,255,255,.055);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      flex-shrink:0; position:sticky; top:0; z-index:20;
      background:rgba(6,14,9,.8);
    }
    .top-title {
      font-size:15px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; flex-shrink:0;
      background:linear-gradient(135deg,#edf7f0 0%,#86efac 60%,#4ade80 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .top-right { display:flex; align-items:center; gap:12px; }
    .top-clock { font-family:'Inter',sans-serif; font-size:12px; font-weight:300; letter-spacing:.06em; color:var(--text-md); white-space:nowrap; }
    .edit-btn {
      font-family:'Inter',sans-serif; font-size:11.5px; font-weight:500; letter-spacing:.04em;
      display:flex; align-items:center; gap:6px;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
      border-radius:8px; color:var(--text-md); padding:7px 14px;
      cursor:pointer; transition:all .2s; flex-shrink:0;
    }
    .edit-btn:hover { background:rgba(255,255,255,.09); color:var(--text-hi); }
    .edit-btn.active { background:rgba(74,222,128,.12); border-color:rgba(74,222,128,.3); color:#86efac; }

    /* ── EDIT BANNER ── */
    .edit-banner {
      display:none; align-items:center; justify-content:space-between; gap:10px;
      background:rgba(74,222,128,.07); border-bottom:1px solid rgba(74,222,128,.15);
      padding:9px 24px; font-size:11.5px; color:#86efac; letter-spacing:.04em; flex-shrink:0;
    }
    body.edit-mode .edit-banner { display:flex; }
    .banner-btns { display:flex; gap:8px; flex-shrink:0; }
    .reset-btn { font-family:inherit; font-size:11px; background:none; border:1px solid rgba(74,222,128,.2); border-radius:6px; color:rgba(74,222,128,.6); padding:5px 12px; cursor:pointer; transition:all .18s; }
    .reset-btn:hover { border-color:rgba(74,222,128,.4); color:#86efac; }

    /* ── SEARCH ── */
    .search-wrap {
      position:relative; padding:0 24px 0;
      flex-shrink:0; margin-top:0;
    }
    .search-wrap svg { position:absolute; left:38px; top:50%; transform:translateY(-50%); color:var(--text-lo); pointer-events:none; }
    .search-wrap input { width:100%; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.07); border-radius:8px; color:var(--text-hi); font-family:inherit; font-size:13px; padding:9px 14px 9px 40px; outline:none; transition:border-color .2s,background .2s; }
    .search-wrap input::placeholder { color:var(--text-lo); }
    .search-wrap input:focus { border-color:rgba(74,222,128,.3); background:rgba(74,222,128,.04); }

    /* ── HERO ── */
    .hero {
      display:flex; flex-direction:column; align-items:center;
      padding:36px 24px 24px; text-align:center; flex-shrink:0;
    }
    .hero-icon-wrap {
      position:relative; width:150px; height:150px;
      display:flex; align-items:center; justify-content:center;
      margin-bottom:16px;
    }
    .hero-glow {
      position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(circle,rgba(var(--active-glow),.22) 0%,transparent 70%);
      transition:background .5s; animation:pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.12);opacity:.7} }
    .hero-ring  { position:absolute; inset:-8px;  border-radius:50%; border:1px solid rgba(var(--active-glow),.18); transition:border-color .5s; }
    .hero-ring-2{ position:absolute; inset:-18px; border-radius:50%; border:1px solid rgba(var(--active-glow),.08); transition:border-color .5s; }
    .hero-icon {
      width:80px; height:80px; display:flex; align-items:center; justify-content:center;
      position:relative; z-index:1;
      transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .22s;
    }
    .hero-icon svg { filter:drop-shadow(0 0 18px rgba(var(--active-glow),.7)) drop-shadow(0 0 36px rgba(var(--active-glow),.3)); transition:filter .4s; }
    .hero-icon.out { transform:scale(.55) translateY(-8px); opacity:0; }
    .hero-name {
      font-size:clamp(1.4rem,4vw,2rem); font-weight:700; letter-spacing:-.01em; color:var(--text-hi);
      transition:opacity .22s;
    }
    body.edit-mode .hero-name[data-editable="true"] { cursor:text; border-bottom:1px dashed rgba(74,222,128,.4); }
    .hero-name.out { opacity:0; }
    .hero-sub  { margin-top:8px; font-family:'Inter',sans-serif; font-size:11px; font-weight:500; letter-spacing:.14em; color:rgba(var(--active-glow),.6); text-transform:uppercase; transition:opacity .22s; }
    .hero-sub.out  { opacity:0; }
    .hero-count{ margin-top:6px; font-size:12px; color:var(--text-lo); transition:opacity .22s; }
    .hero-count.out{ opacity:0; }
    /* Edit-mode category controls in hero */
    .hero-cat-ctrl { display:none; gap:8px; margin-top:14px; }
    body.edit-mode .hero-cat-ctrl.visible { display:flex; }
    .hcbtn {
      font-family:inherit; font-size:11.5px; padding:6px 14px; border-radius:8px; cursor:pointer; border:none; transition:all .18s;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:var(--text-md);
    }
    .hcbtn:hover { background:rgba(255,255,255,.1); color:var(--text-hi); }
    .hcbtn.danger { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.22); color:#fca5a5; }
    .hcbtn.danger:hover { background:rgba(239,68,68,.2); }

    /* ── STRIP WRAPPER ── */
    .strip-outer {
      position:sticky; top:49px; z-index:10;
      background:rgba(6,14,9,.85); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
      border-top:1px solid rgba(255,255,255,.05); border-bottom:1px solid rgba(255,255,255,.05);
      flex-shrink:0;
    }
    .strip-outer::before,.strip-outer::after { content:''; position:absolute; top:0; bottom:0; width:48px; z-index:1; pointer-events:none; }
    .strip-outer::before { left:0;  background:linear-gradient(90deg,rgba(6,14,9,.95),transparent); }
    .strip-outer::after  { right:0; background:linear-gradient(-90deg,rgba(6,14,9,.95),transparent); }

    /* ── STRIP ── */
    .cat-strip {
      display:flex; gap:10px; padding:14px 48px;
      overflow-x:auto; scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch; scrollbar-width:none; cursor:grab;
    }
    .cat-strip::-webkit-scrollbar { display:none; }
    .cat-strip.dragging { cursor:grabbing; }
    .cat-item {
      flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:7px; padding:12px 10px 10px; width:82px;
      background:rgba(255,255,255,.028); border:1px solid rgba(255,255,255,.06); border-radius:18px;
      cursor:pointer; scroll-snap-align:center;
      transition:transform .28s cubic-bezier(.34,1.56,.64,1),background .25s,border-color .25s,box-shadow .25s;
      -webkit-tap-highlight-color:transparent;
    }
    .cat-item:hover { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.12); transform:translateY(-2px); }
    .cat-item.active {
      background:rgba(var(--item-glow,96,165,250),.1); border-color:rgba(var(--item-glow,96,165,250),.3);
      box-shadow:0 0 20px rgba(var(--item-glow,96,165,250),.12),0 4px 20px rgba(0,0,0,.3);
      transform:translateY(-4px) scale(1.05);
    }
    .cat-icon { width:34px; height:34px; display:flex; align-items:center; justify-content:center; transition:transform .28s cubic-bezier(.34,1.56,.64,1); }
    .cat-icon svg { filter:drop-shadow(0 0 3px rgba(var(--item-glow),.25)); transition:filter .25s; }
    .cat-item.active .cat-icon { transform:scale(1.1); }
    .cat-item.active .cat-icon svg { filter:drop-shadow(0 0 10px rgba(var(--item-glow),.9)) drop-shadow(0 0 20px rgba(var(--item-glow),.4)); }
    .cat-label { font-size:9.5px; font-weight:500; letter-spacing:.04em; color:var(--text-lo); text-align:center; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:72px; transition:color .2s; }
    .cat-item.active .cat-label { color:rgb(var(--item-glow,96,165,250)); }

    /* ── CONTENT ── */
    .content-area { flex:1; padding:22px 20px 80px; max-width:720px; margin:0 auto; width:100%; }

    /* Single-category card */
    .single-card {
      background:var(--card-bg); border:1px solid rgba(255,255,255,.07); border-radius:var(--r);
      backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); overflow:hidden; position:relative;
    }
    body.edit-mode .single-card { border-color:rgba(74,222,128,.14); border-style:dashed; }
    .single-card::before {
      content:''; position:absolute; inset:0; border-radius:var(--r); padding:1px;
      background:conic-gradient(from var(--border-angle),rgba(74,222,128,.7),rgba(52,211,153,.6),rgba(16,185,129,.5),rgba(110,231,183,.6),rgba(74,222,128,.7));
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude;
      opacity:0; transition:opacity .4s; pointer-events:none; z-index:1;
    }
    .single-card:hover::before { opacity:.85; }

    /* Link items */
    .link-item {
      display:flex; align-items:center; padding:12px 18px;
      border-bottom:1px solid rgba(255,255,255,.04);
      text-decoration:none; color:var(--text-md); gap:10px;
      transition:color .15s,background .15s,padding-left .15s;
      position:relative; z-index:2;
      opacity:0; transform:translateY(8px);
    }
    .link-item.visible { animation:li-in .4s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes li-in { to{opacity:1;transform:none} }
    .link-item:last-child { border-bottom:none; }
    .link-item:hover { color:var(--text-hi); background:rgba(255,255,255,.035); padding-left:26px; }
    .link-arr  { font-size:14px; opacity:.3; flex-shrink:0; transition:opacity .15s,transform .15s,color .15s; }
    .link-item:hover .link-arr { opacity:.9; transform:translateX(2px); color:rgb(var(--active-glow,74,222,128)); }
    .link-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
    .link-badge { font-size:9.5px; padding:2px 8px; border-radius:20px; background:rgba(255,255,255,.04); color:var(--text-lo); border:1px solid rgba(255,255,255,.07); white-space:nowrap; flex-shrink:0; }
    /* Edit row buttons */
    .link-row-btns { display:none; gap:2px; flex-shrink:0; }
    body.edit-mode .link-row-btns { display:flex; }
    .lbtn { background:none; border:none; cursor:pointer; color:var(--text-lo); padding:5px; border-radius:4px; display:flex; align-items:center; transition:color .15s,background .15s; }
    .lbtn:hover { color:var(--text-hi); background:rgba(255,255,255,.07); }
    .lbtn.del:hover { color:#fca5a5; }
    /* Add link button */
    .add-link-btn { display:none; width:100%; padding:10px 18px; background:none; border:none; border-top:1px dashed rgba(255,255,255,.08); color:var(--text-lo); font-family:inherit; font-size:12.5px; cursor:pointer; text-align:left; transition:color .15s,background .15s; position:relative; z-index:2; }
    body.edit-mode .add-link-btn { display:block; }
    .add-link-btn:hover { color:var(--text-md); background:rgba(255,255,255,.03); }

    /* All-categories grid */
    .all-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
    .all-card {
      background:var(--card-bg); border:1px solid rgba(255,255,255,.07); border-radius:14px;
      padding:18px 16px; cursor:pointer;
      transition:transform .22s,border-color .22s,box-shadow .22s;
      display:flex; flex-direction:column; gap:10px;
      opacity:0; transform:translateY(16px) scale(.97);
    }
    .all-card.visible { animation:ac-in .55s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes ac-in { to{opacity:1;transform:none} }
    .all-card:hover { transform:translateY(-3px); border-color:rgba(var(--item-glow,96,165,250),.3); box-shadow:0 0 20px rgba(var(--item-glow,96,165,250),.08),0 12px 40px rgba(0,0,0,.4); }
    .ac-top { display:flex; align-items:center; gap:10px; }
    .ac-icon { width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
    .ac-title { font-size:13px; font-weight:700; color:var(--text-hi); }
    .ac-count { font-size:11px; color:var(--text-lo); }
    .ac-links { display:flex; flex-direction:column; gap:2px; }
    .ac-link-preview { font-size:11.5px; color:var(--text-md); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 0; }
    /* Search highlight */
    .all-card.search-hidden { display:none; }
    .link-item.search-hidden { display:none; }

    /* ── MODAL (shared) ── */
    .modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.65); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .22s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal { background:rgba(8,10,24,.97); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:28px 28px 22px; width:min(460px,calc(100vw - 40px)); transform:scale(.95) translateY(14px); transition:transform .28s cubic-bezier(.16,1,.3,1); max-height:90vh; overflow-y:auto; }
    .modal.wide { width:min(560px,calc(100vw - 40px)); }
    .modal-overlay.open .modal { transform:scale(1) translateY(0); }
    .modal-title { font-size:15px; font-weight:700; color:var(--text-hi); margin-bottom:22px; }
    .modal-field { margin-bottom:16px; }
    .modal-field label { display:block; font-size:11.5px; color:var(--text-md); margin-bottom:7px; letter-spacing:.04em; }
    .modal-field input,.modal-field select { width:100%; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:8px; color:var(--text-hi); font-family:inherit; font-size:13.5px; padding:10px 14px; outline:none; transition:border-color .2s,background .2s; }
    .modal-field input::placeholder { color:var(--text-lo); }
    .modal-field input:focus,.modal-field select:focus { border-color:rgba(74,222,128,.4); background:rgba(74,222,128,.03); }
    .modal-field select { cursor:pointer; }
    .modal-field select option { background:#0a1a10; color:var(--text-hi); }
    .modal-actions { display:flex; gap:10px; margin-top:22px; align-items:center; flex-wrap:wrap; }
    .mbtn { font-family:inherit; font-size:13px; font-weight:500; border-radius:8px; padding:9px 22px; cursor:pointer; border:none; transition:all .18s; }
    .mbtn.primary   { background:rgba(74,222,128,.16); border:1px solid rgba(74,222,128,.3); color:#86efac; }
    .mbtn.primary:hover { background:rgba(74,222,128,.26); }
    .mbtn.secondary { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09); color:var(--text-md); }
    .mbtn.secondary:hover { background:rgba(255,255,255,.08); color:var(--text-hi); }
    .mbtn.danger    { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.22); color:#fca5a5; margin-left:auto; }
    .mbtn.danger:hover { background:rgba(239,68,68,.2); }
    .form-error { color:#fca5a5; font-size:11.5px; margin:-6px 0 10px; display:none; }
    .form-msg   { font-size:11.5px; margin-top:6px; display:none; }

    /* ── ICON / COLOR PICKER ── */
    .icon-picker { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; max-height:220px; overflow-y:auto; padding:2px; }
    .ip-item { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.07); cursor:pointer; background:rgba(255,255,255,.02); transition:background .15s,border-color .15s; }
    .ip-item:hover { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.15); }
    .ip-item.selected { background:rgba(74,222,128,.12); border-color:rgba(74,222,128,.38); }
    .ip-item span { font-size:9px; color:var(--text-lo); }
    .color-picker { display:flex; gap:10px; flex-wrap:wrap; padding:2px; }
    .cp-swatch { width:30px; height:30px; border-radius:50%; cursor:pointer; border:2.5px solid transparent; transition:transform .15s,border-color .15s; outline:none; }
    .cp-swatch:hover { transform:scale(1.1); }
    .cp-swatch.selected { border-color:rgba(255,255,255,.85); box-shadow:0 0 10px rgba(255,255,255,.2); transform:scale(1.15); }

    /* ── PW CHANGE ── */
    .pw-change-row { margin-top:18px; padding-top:18px; border-top:1px solid rgba(255,255,255,.06); }
    .pw-change-row p { font-size:11px; color:var(--text-lo); margin-bottom:10px; }
    .pw-change-inputs { display:flex; gap:8px; flex-wrap:wrap; }
    .pw-change-inputs input { flex:1; min-width:120px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:8px; color:var(--text-hi); font-family:inherit; font-size:12.5px; padding:8px 12px; outline:none; transition:border-color .2s; }
    .pw-change-inputs input:focus { border-color:rgba(74,222,128,.35); }

    /* ── KEYFRAMES ── */
    @keyframes fu { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    @keyframes fi { from{opacity:0} to{opacity:1} }

    /* ── RESPONSIVE ── */
    /* hero-text: groups name/sub/count/ctrl for flexbox layout switching */
    .hero-text { display:flex; flex-direction:column; align-items:center; }

    /* ── Mobile ≤559px (default is already mobile-first, this adds tweaks) ── */
    @media (max-width:559px) {
      .hero      { padding:24px 16px 16px; }
      .hero-icon-wrap { width:126px; height:126px; }
      .hero-icon { width:66px; height:66px; }
      .hero-icon svg  { width:66px!important; height:66px!important; }
      .content-area   { padding:16px 14px 64px; }
      .icon-picker    { grid-template-columns:repeat(4,1fr); }
    }
    /* ── Extra-small ≤399px ── */
    @media (max-width:399px) {
      .top-bar   { padding:12px 14px; }
      .hero      { padding:16px 12px 12px; }
      .hero-icon-wrap { width:108px; height:108px; }
      .hero-icon { width:56px; height:56px; }
      .hero-icon svg  { width:56px!important; height:56px!important; }
      .hero-name { font-size:1.25rem; }
      .cat-strip { gap:8px; padding:10px 28px; }
      .cat-item  { width:70px; padding:10px 6px 8px; }
      .cat-label { font-size:8.5px; max-width:64px; }
      .content-area { padding:14px 10px 60px; }
      .search-wrap  { padding:0 16px; }
    }

    /* ── Tablet 560px–899px ── */
    @media (min-width:560px) {
      .hero      { padding:30px 36px 22px; }
      .hero-icon-wrap { width:138px; height:138px; }

  return el;
}

/* ═══════════════ SELECT ═══════════════ */
function selectCategory(id, scrollStrip = true) {
  if (id === activeId) return;
  activeId = id;

  document.querySelectorAll('.cat-item').forEach(el =>
    el.classList.toggle('active', el.dataset.catId === id)
  );

  if (scrollStrip) {
    const strip = document.getElementById('cat-strip');
    const item  = strip.querySelector(`[data-cat-id="${id}"]`);
    if (item) {
      suppressScroll = true;
      const offset = item.offsetLeft - strip.clientWidth / 2 + item.offsetWidth / 2;
      strip.scrollTo({ left: offset, behavior:'smooth' });
      setTimeout(() => { suppressScroll = false; }, 600);
    }
  }

  // Update glow
  const cat = data.find(c => c.id === id);
  const glow = id === ALL_ID ? '74,222,128' : (cat?.glow || '74,222,128');
  root.style.setProperty('--active-glow', glow);

  // Hero animation
  animateHeroOut(() => { updateHero(id); animateHeroIn(); });
  renderContent(id);
  updateHeroCatCtrl(id);
}

/* ═══════════════ HERO ═══════════════ */
const heroIcon  = document.getElementById('hero-icon');
const heroName  = document.getElementById('hero-name');
const heroSub   = document.getElementById('hero-sub');
const heroCount = document.getElementById('hero-count');
const heroGlow  = document.getElementById('hero-glow');
const heroRing  = document.getElementById('hero-ring');
const heroRing2 = document.getElementById('hero-ring2');

function animateHeroOut(cb) {
  heroIcon.classList.add('out'); heroName.classList.add('out');
  heroSub.classList.add('out');  heroCount.classList.add('out');
  setTimeout(cb, 220);
}
function animateHeroIn() {
  heroIcon.classList.remove('out'); heroName.classList.remove('out');
  heroSub.classList.remove('out');  heroCount.classList.remove('out');
}

function updateHero(id) {
  if (id === ALL_ID) {
    const ag = '74,222,128';
    heroIcon.innerHTML = svgIcon('globe', 80, ag);
    heroName.textContent  = 'すべてのカテゴリ';
    heroSub.textContent   = 'ALL CATEGORIES';
    heroCount.textContent = `${data.length} カテゴリ / ${data.reduce((s,c)=>s+c.links.length,0)} リンク`;
    heroGlow.style.background   = `radial-gradient(circle,rgba(${ag},.2) 0%,transparent 70%)`;
    heroRing.style.borderColor  = `rgba(${ag},.18)`;
    heroRing2.style.borderColor = `rgba(${ag},.08)`;
  } else {
    const cat = data.find(c => c.id === id);
    if (!cat) return;
    const g = cat.glow;
    heroIcon.innerHTML = svgIcon(cat.iconKey || 'globe', 80, g);
    heroName.textContent  = cat.title;
    heroSub.textContent   = cat.tag;
    heroCount.textContent = `${cat.links.length} リンク`;
    heroGlow.style.background   = `radial-gradient(circle,rgba(${g},.22) 0%,transparent 70%)`;
    heroRing.style.borderColor  = `rgba(${g},.2)`;
    heroRing2.style.borderColor = `rgba(${g},.09)`;
  }
  // inline editing
  heroName.dataset.editable = (id !== ALL_ID) ? 'true' : 'false';
}

function updateHeroCatCtrl(id) {
  const ctrl = document.getElementById('hero-cat-ctrl');
  ctrl.classList.toggle('visible', id !== ALL_ID);
  document.getElementById('hero-edit-cat').onclick = () => openCatModal(id);
  document.getElementById('hero-del-cat').onclick  = () => deleteCategoryConfirm(id);
}

/* ── Hero name inline edit ── */
heroName.addEventListener('click', () => {
  if (!editMode || heroName.dataset.editable !== 'true') return;
  heroName.contentEditable = 'true'; heroName.focus();
  const r = document.createRange(); r.selectNodeContents(heroName);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
});
heroName.addEventListener('blur', () => {
  if (heroName.contentEditable !== 'true') return;
  heroName.contentEditable = 'false';
  const cat = data.find(c => c.id === activeId);
  if (cat) { cat.title = heroName.textContent.trim() || cat.title; heroName.textContent = cat.title; saveData(); buildStrip(); }
});
heroName.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); heroName.blur(); }
  if (e.key === 'Escape') heroName.contentEditable = 'false';
});

/* ═══════════════ CONTENT ═══════════════ */
function renderContent(id) {
  const area = document.getElementById('content-area');
  area.innerHTML = '';

  if (id === ALL_ID) {
    const grid = document.createElement('div');
    grid.className = 'all-grid';
    data.forEach((cat, ci) => {
      const card = document.createElement('div');
      card.className = 'all-card';
      card.style.setProperty('--item-glow', cat.glow);
      card.dataset.catId = cat.id;
      card.innerHTML = `
        <div class="ac-top">
          <div class="ac-icon">${svgIcon(cat.iconKey||'globe', 26, cat.glow)}</div>
          <div><div class="ac-title">${esc(cat.title)}</div><div class="ac-count">${cat.links.length} リンク</div></div>
        </div>
        <div class="ac-links">
          ${cat.links.slice(0,3).map(l=>`<div class="ac-link-preview">› ${esc(l.name)}</div>`).join('')}
          ${cat.links.length>3 ? `<div class="ac-link-preview" style="opacity:.4">他 ${cat.links.length-3} 件...</div>` : ''}
        </div>`;
      card.addEventListener('click', () => selectCategory(cat.id, true));
      grid.appendChild(card);
      setTimeout(() => card.classList.add('visible'), 50 + ci * 60);
    });
    area.appendChild(grid);
  } else {
    const cat = data.find(c => c.id === id);
    if (!cat) return;

    const card = document.createElement('div');
    card.className = 'single-card';

    cat.links.forEach((lk, li) => {
      const row = document.createElement('div');
      row.style.display = 'flex'; row.style.alignItems = 'center';
      row.dataset.linkId = lk.id;

      const a = document.createElement('a');
      a.className = 'link-item';
      a.href   = safeUrl(lk.url);
      a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = `<span class="link-arr">›</span><span class="link-name">${esc(lk.name)}</span>${lk.badge?`<span class="link-badge">${esc(lk.badge)}</span>`:''}`;
      a.style.flex = '1';

      const btns = document.createElement('div');
      btns.className = 'link-row-btns';
      btns.innerHTML = `
        <button class="lbtn" title="編集"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="lbtn del" title="削除"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
      btns.children[0].addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openLinkModal(id, lk.id); });
      btns.children[1].addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); deleteLink(id, lk.id); });

      row.appendChild(a); row.appendChild(btns);
      card.appendChild(row);
      setTimeout(() => a.classList.add('visible'), 50 + li * 40);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-link-btn';
    addBtn.textContent = '＋ リンクを追加';
    addBtn.addEventListener('click', () => openLinkModal(id, null));
    card.appendChild(addBtn);

    area.appendChild(card);
  }
}

/* ═══════════════ DRAG SCROLL ═══════════════ */
function setupDragScroll(el) {
  let isDown = false, startX, scrollLeft;
  el.addEventListener('mousedown', e => { isDown=true; el.classList.add('dragging'); startX=e.pageX-el.offsetLeft; scrollLeft=el.scrollLeft; });
  el.addEventListener('mouseleave', () => { isDown=false; el.classList.remove('dragging'); });
  el.addEventListener('mouseup',    () => { isDown=false; el.classList.remove('dragging'); });
  el.addEventListener('mousemove',  e => { if(!isDown) return; e.preventDefault(); el.scrollLeft = scrollLeft - (e.pageX - el.offsetLeft - startX) * 1.2; });
  let timer;
  el.addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (suppressScroll) return;
      const cx = el.getBoundingClientRect().left + el.clientWidth / 2;
      let closest = null, minD = Infinity;
      el.querySelectorAll('.cat-item').forEach(item => {
        const r = item.getBoundingClientRect();
        const d = Math.abs(r.left + r.width / 2 - cx);
        if (d < minD) { minD = d; closest = item; }
      });
      if (closest && closest.dataset.catId !== activeId)
        selectCategory(closest.dataset.catId, false);
    }, 80);
  });
}

/* ═══════════════ SEARCH ═══════════════ */
document.getElementById('search-input').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (activeId !== ALL_ID) {
    document.querySelectorAll('.link-item').forEach(a => {
      const row = a.parentElement;
      row.classList.toggle('search-hidden', q !== '' && !a.textContent.toLowerCase().includes(q));
    });
  } else {
    document.querySelectorAll('.all-card').forEach(card => {
      const catId = card.dataset.catId;
      const cat = data.find(c => c.id === catId);
      const match = q === '' || (cat && (cat.title.toLowerCase().includes(q) || cat.links.some(l => l.name.toLowerCase().includes(q))));
      card.classList.toggle('search-hidden', !match);
    });
  }
});

/* ═══════════════ PASSWORD MODAL ═══════════════ */
const pwOverlay   = document.getElementById('pw-overlay');
const pwInput     = document.getElementById('pw-input');
const pwError     = document.getElementById('pw-error');
const pwNew1      = document.getElementById('pw-new1');
const pwNew2      = document.getElementById('pw-new2');
const pwChangeMsg = document.getElementById('pw-change-msg');

function openPasswordModal() {
  pwInput.value=''; pwNew1.value=''; pwNew2.value='';
  pwError.style.display='none'; pwChangeMsg.style.display='none';
  pwOverlay.classList.add('open');
  setTimeout(() => pwInput.focus(), 60);
}
function closePasswordModal() { pwOverlay.classList.remove('open'); }

document.getElementById('edit-toggle').addEventListener('click', () => {
  editMode ? exitEditMode() : openPasswordModal();
});

document.getElementById('pw-ok').addEventListener('click', async () => {
  const hash = await sha256(pwInput.value);
  if (hash === getStoredHash()) { closePasswordModal(); enterEditMode(); }
  else { pwError.style.display='block'; pwInput.value=''; pwInput.focus(); }
});
document.getElementById('pw-cancel').addEventListener('click', closePasswordModal);
pwOverlay.addEventListener('click', e => { if (e.target===pwOverlay) closePasswordModal(); });
pwInput.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('pw-ok').click(); });

document.getElementById('pw-change-btn').addEventListener('click', async () => {
  const p1=pwNew1.value, p2=pwNew2.value;
  if (!p1) { showMsg(pwChangeMsg,'新しいパスワードを入力してください','#fca5a5'); return; }
  if (p1!==p2) { showMsg(pwChangeMsg,'パスワードが一致しません','#fca5a5'); return; }
  if (p1.length<4) { showMsg(pwChangeMsg,'4文字以上で入力してください','#fca5a5'); return; }
  localStorage.setItem(PW_KEY, await sha256(p1));
  pwNew1.value=''; pwNew2.value='';
  showMsg(pwChangeMsg,'パスワードを変更しました','#86efac');
});

function showMsg(el, msg, color) { el.textContent=msg; el.style.color=color; el.style.display='block'; setTimeout(()=>{el.style.display='none';},3000); }

function enterEditMode() {
  editMode = true;
  document.body.classList.add('edit-mode');
  document.getElementById('edit-toggle').classList.add('active');
  document.getElementById('edit-label').textContent = '完了';
  updateHeroCatCtrl(activeId);
}
function exitEditMode() {
  editMode = false;
  document.body.classList.remove('edit-mode');
  document.getElementById('edit-toggle').classList.remove('active');
  document.getElementById('edit-label').textContent = '編集';
  if (heroName.contentEditable === 'true') heroName.blur();
}

/* ═══════════════ CATEGORY MODAL ═══════════════ */
const catOverlay = document.getElementById('cat-overlay');
let _catId = null, _catIconKey = 'globe', _catGlow = '96,165,250';

function buildIconPicker() {
  const c = document.getElementById('icon-picker'); c.innerHTML='';
  ICON_PALETTE.forEach(ico => {
    const el = document.createElement('div');
    el.className = 'ip-item' + (ico.key===_catIconKey?' selected':'');
    el.dataset.key = ico.key;
    el.innerHTML = `${svgIcon(ico.key,24,_catGlow)}<span>${ico.label}</span>`;
    el.addEventListener('click', () => {
      _catIconKey = ico.key;
      c.querySelectorAll('.ip-item').forEach(i => i.classList.toggle('selected', i.dataset.key===ico.key));
      c.querySelectorAll('.ip-item').forEach(i => { const s=i.querySelector('svg'); if(s){s.remove(); i.insertAdjacentHTML('afterbegin',svgIcon(i.dataset.key,24,_catGlow));} });
    });
    c.appendChild(el);
  });
}
function buildColorPicker() {
  const c = document.getElementById('color-picker'); c.innerHTML='';
  GLOW_PALETTE.forEach(g => {
    const el = document.createElement('button');
    el.className = 'cp-swatch' + (g.value===_catGlow?' selected':'');
    el.style.background = `rgb(${g.value})`; el.title=g.label; el.dataset.val=g.value;
    el.addEventListener('click', () => {
      _catGlow = g.value;
      c.querySelectorAll('.cp-swatch').forEach(s => s.classList.toggle('selected', s.dataset.val===g.value));
      buildIconPicker();
    });
    c.appendChild(el);
  });
}

function openCatModal(catId) {
  _catId = catId || null;
  const catDel = document.getElementById('cat-delete');
  if (catId) {
    const cat = data.find(c => c.id===catId); if (!cat) return;
    document.getElementById('cat-modal-title').textContent = 'カテゴリを編集';
    document.getElementById('cat-name').value = cat.title;
    document.getElementById('cat-tag').value  = cat.tag;
    _catIconKey = cat.iconKey || 'globe'; _catGlow = cat.glow || '96,165,250';
    catDel.style.display = '';
  } else {
    document.getElementById('cat-modal-title').textContent = 'カテゴリを追加';
    document.getElementById('cat-name').value = ''; document.getElementById('cat-tag').value = '';
    _catIconKey = 'globe'; _catGlow = '96,165,250'; catDel.style.display = 'none';
  }
  buildIconPicker(); buildColorPicker();
  catOverlay.classList.add('open');
  setTimeout(() => document.getElementById('cat-name').focus(), 60);
}
function closeCatModal() { catOverlay.classList.remove('open'); }

document.getElementById('cat-save').addEventListener('click', () => {
  const name = document.getElementById('cat-name').value.trim();
  const tag  = document.getElementById('cat-tag').value.trim().toUpperCase() || 'CAT';
  if (!name) { document.getElementById('cat-name').focus(); return; }
  if (_catId) {
    const cat = data.find(c=>c.id===_catId);
    if (cat) { cat.title=name; cat.tag=tag; cat.iconKey=_catIconKey; cat.glow=_catGlow; }
  } else {
    data.push({ id:uid(), title:name, tag, glow:_catGlow, iconKey:_catIconKey, links:[] });
  }
  saveData(); closeCatModal();
  buildStrip();
  if (_catId && _catId===activeId) { updateHero(activeId); updateHeroCatCtrl(activeId); }
  else if (!_catId) { selectCategory(data[data.length-1].id, true); }
  else { renderContent(activeId); }
});

document.getElementById('cat-delete').addEventListener('click', () => {
  const cat = data.find(c=>c.id===_catId); if (!cat) return;
  if (!confirm(`「${cat.title}」を削除しますか？\nリンク ${cat.links.length} 件も削除されます`)) return;
  closeCatModal();
  data = data.filter(c=>c.id!==_catId);
  saveData(); buildStrip();
  selectCategory(ALL_ID, true);
  updateHero(ALL_ID); renderContent(ALL_ID); updateHeroCatCtrl(ALL_ID);
});

function deleteCategoryConfirm(catId) {
  const cat = data.find(c=>c.id===catId); if (!cat) return;
  if (!confirm(`「${cat.title}」を削除しますか？`)) return;
  data = data.filter(c=>c.id!==catId);
  saveData(); buildStrip();
  selectCategory(ALL_ID, true);
  updateHero(ALL_ID); renderContent(ALL_ID); updateHeroCatCtrl(ALL_ID);
}

document.getElementById('cat-cancel').addEventListener('click', closeCatModal);
catOverlay.addEventListener('click', e => { if(e.target===catOverlay) closeCatModal(); });
document.getElementById('add-cat-btn').addEventListener('click', () => openCatModal(null));

/* ═══════════════ LINK MODAL ═══════════════ */
const linkOverlay = document.getElementById('link-overlay');
let _linkCatId = null, _linkId = null;

function openLinkModal(catId, linkId) {
  _linkCatId=catId; _linkId=linkId;
  const lDel = document.getElementById('link-delete');
  if (linkId) {
    const cat=data.find(c=>c.id===catId), lk=cat?.links.find(l=>l.id===linkId);
    if (!lk) return;
    document.getElementById('link-modal-title').textContent='リンクを編集';
    document.getElementById('link-name').value=lk.name; document.getElementById('link-url').value=lk.url;
    document.getElementById('link-badge').value=lk.badge||'';
    document.getElementById('link-save').textContent='保存'; lDel.style.display='';
  } else {
    document.getElementById('link-modal-title').textContent='リンクを追加';
    document.getElementById('link-name').value=''; document.getElementById('link-url').value='';
    document.getElementById('link-badge').value='';
    document.getElementById('link-save').textContent='追加'; lDel.style.display='none';
  }
  linkOverlay.classList.add('open');
  setTimeout(() => document.getElementById('link-name').focus(), 60);
}
function closeLinkModal() { linkOverlay.classList.remove('open'); }

document.getElementById('link-save').addEventListener('click', () => {
  const name=document.getElementById('link-name').value.trim(), url=document.getElementById('link-url').value.trim()||'#';
  if (!name) { document.getElementById('link-name').focus(); return; }
  const cat=data.find(c=>c.id===_linkCatId); if (!cat) return;
  if (_linkId) { const lk=cat.links.find(l=>l.id===_linkId); if(lk){lk.name=name;lk.url=url;lk.badge=document.getElementById('link-badge').value;} }
  else         { cat.links.push({id:uid(),name,url,badge:document.getElementById('link-badge').value}); }
  saveData(); closeLinkModal(); renderContent(activeId); updateHero(activeId);
});

document.getElementById('link-delete').addEventListener('click', () => {
  if (!_linkId) return;
  if (!confirm('このリンクを削除しますか？')) return;
  deleteLink(_linkCatId, _linkId); closeLinkModal();
});
function deleteLink(catId, linkId) {
  const cat=data.find(c=>c.id===catId); if(!cat) return;
  cat.links=cat.links.filter(l=>l.id!==linkId);
  saveData(); renderContent(activeId); updateHero(activeId);
}

document.getElementById('link-cancel').addEventListener('click', closeLinkModal);
linkOverlay.addEventListener('click', e => { if(e.target===linkOverlay) closeLinkModal(); });
document.getElementById('link-name').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('link-url').focus(); });
document.getElementById('link-url').addEventListener('keydown',  e => { if(e.key==='Enter') document.getElementById('link-save').click(); });

/* ═══════════════ RESET ═══════════════ */
document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('リンクをデフォルトに戻しますか？\n（現在の変更はすべて失われます）')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  activeId = ALL_ID;
  buildStrip(); updateHero(ALL_ID); renderContent(ALL_ID); updateHeroCatCtrl(ALL_ID);
});

/* ═══════════════ ESC ═══════════════ */
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closePasswordModal(); closeCatModal(); closeLinkModal(); }
});

/* ═══════════════ CLOCK ═══════════════ */
const DAYS = ['日','月','火','水','木','金','土'];
function tick() {
  const n=new Date(), p=v=>String(v).padStart(2,'0');
  document.getElementById('clock').textContent=`${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())} (${DAYS[n.getDay()]}) ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}
tick(); setInterval(tick,1000);

/* ═══════════════ BORDER ANGLE ═══════════════ */
let bAngle=0;
(function spin(){bAngle=(bAngle+.45)%360;root.style.setProperty('--border-angle',bAngle+'deg');requestAnimationFrame(spin);})();

/* ═══════════════ THREE.JS ═══════════════ */
(function(){
  if(typeof THREE==='undefined') return;
  const canvas=document.getElementById('bg-canvas');
  const W=()=>window.innerWidth, H=()=>window.innerHeight;
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W(),H());
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(55,W()/H(),.1,500);
  camera.position.z=32;
  const sp=new Float32Array(1600*3);
  for(let i=0;i<1600;i++){const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=70+Math.random()*60;sp[i*3]=r*Math.sin(p)*Math.cos(t);sp[i*3+1]=r*Math.sin(p)*Math.sin(t);sp[i*3+2]=r*Math.cos(p);}
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.13,transparent:true,opacity:.45})));
  function em(geo,c,op,pos){const m=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:op}));m.position.set(...pos);scene.add(m);return m;}
  const ico1=em(new THREE.IcosahedronGeometry(12,1),0x1d4ed8,.08,[0,0,-15]);
  const oct1=em(new THREE.OctahedronGeometry(6),0x6d28d9,.1,[18,7,-8]);
  const tor =em(new THREE.TorusGeometry(8,.22,6,40),0x3730a3,.07,[3,-4,-18]);
  let mx=0,my=0,smx=0,smy=0,t=0;
  document.addEventListener('mousemove',e=>{mx=(e.clientX/W()-.5)*2;my=(e.clientY/H()-.5)*2;});
  (function loop(){requestAnimationFrame(loop);t+=.004;ico1.rotation.x=t*.25;ico1.rotation.y=t*.35;oct1.rotation.x=t*.4;oct1.rotation.y=t*.25;tor.rotation.x=t*.2;tor.rotation.z=t*.15;smx+=(mx-smx)*.03;smy+=(my-smy)*.03;camera.position.x=smx*2;camera.position.y=-smy*1.2;camera.lookAt(0,0,0);renderer.render(scene,camera);})();
  window.addEventListener('resize',()=>{camera.aspect=W()/H();camera.updateProjectionMatrix();renderer.setSize(W(),H());});
})();

/* ═══════════════ INIT ═══════════════ */
window.addEventListener('load', () => {
  buildStrip();
  updateHero(ALL_ID);
  renderContent(ALL_ID);
  updateHeroCatCtrl(ALL_ID);
});
